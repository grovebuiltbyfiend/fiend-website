<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FIEND is an independent software publisher behind Grove, an offline budgeting app for Android.">
  <title>FIEND — Independent software publisher</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1d2924; background: #f8f9f5; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 760px; margin: 0 auto; padding: 80px 24px; }
    .brand { font-size: 0.9rem; letter-spacing: .16em; font-weight: 800; }
    h1 { font-size: clamp(2.7rem, 8vw, 5rem); line-height: 1.05; letter-spacing: -.05em; margin: 80px 0 24px; }
    .intro { max-width: 590px; font-size: 1.25rem; line-height: 1.65; color: #46584e; }
    section { margin-top: 72px; padding-top: 28px; border-top: 1px solid #dce4db; }
    h2 { font-size: 1.25rem; margin: 0 0 12px; }
    p { line-height: 1.7; }
    a { color: #245e43; text-underline-offset: 3px; overflow-wrap: anywhere; }
    footer { margin-top: 80px; color: #64756a; font-size: .9rem; }
    @media (max-width: 480px) { main { padding-top: 40px; } h1 { margin-top: 60px; } }
  </style>
</head>
<body>
  <main>
    <div class="brand">FIEND</div>
    <h1>Software made with care.</h1>
    <p class="intro">FIEND is an independent software publisher behind Grove, an offline budgeting app for Android.</p>
    <section aria-labelledby="grove-heading">
      <h2 id="grove-heading">Grove</h2>
      <p>Grove helps you manage your budget offline. Read the <a href="https://grovebuiltbyfiend.github.io/grove-privacy/">Grove privacy policy</a>.</p>

    <section aria-labelledby="contact-heading">

      <p><a href="mailto:builtbyfiend@gmail.com">builtbyfiend@gmail.com</a></p>
    </section>
    <footer>© 2026 FIEND</footer>
